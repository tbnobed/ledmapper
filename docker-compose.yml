services:
  volumesplit:
    build: .
    container_name: volumesplit
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      VS_DATA: /data
      VS_WORKERS: "1"          # ffmpeg saturates cores; raise only with headroom
      FAL_KEY: "${FAL_KEY:-}"  # fal.ai API key for AI plate generation (put it in .env)
      # encode tuning — read at container start, restart to apply (no rebuild)
      VS_ENCODE_THREADS: "${VS_ENCODE_THREADS:-10}"   # x264 threads per output encoder
      VS_FILTER_THREADS: "${VS_FILTER_THREADS:-16}"   # unwrap/blend graph threads
      # retention — keeps disk and the jobs list from growing forever (0 = unlimited)
      VS_MAX_JOBS: "${VS_MAX_JOBS:-15}"               # newest finished jobs that keep outputs on disk
      VS_MAX_JOB_RECORDS: "${VS_MAX_JOB_RECORDS:-50}" # job records kept in the list at all
    volumes:
      - vs-data:/data
      # bind-mount your plate storage to pull sources straight off the share:
      # - /mnt/media/plates:/data/uploads
    deploy:
      resources:
        limits:
          # must leave real headroom over peak encode memory — the 8G cap
          # here is what was OOM-killing full-canvas encodes (exit -9)
          # even though the VM had free RAM
          memory: 18G
    tmpfs:
      - /tmp:size=2g

volumes:
  vs-data:
